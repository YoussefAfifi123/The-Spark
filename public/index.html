<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spark — Learning & Focus Platform</title>
<meta name="description" content="Learning & Focus Platform">
<meta property="og:title" content="Spark — Learning & Focus Platform">
<meta property="og:description" content="Learning & Focus Platform">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
tailwind.config={theme:{extend:{fontFamily:{display:['Fredoka'],body:['Nunito']},colors:{spark:{50:'#FFF4EB',100:'#FFE4C7',200:'#FFC78A',300:'#FFA64D',400:'#FF8C42',500:'#FF7023',600:'#E85A10',700:'#BF4410',800:'#963714',900:'#7A3016'},slate:{850:'#161621',900:'#0F0F14',950:'#0A0A0E'}}}}};
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<button id="menu-btn" aria-label="Open menu"><i class="fas fa-bars"></i></button>
<div id="sidebar-backdrop" class="sidebar-backdrop" onclick="closeSidebarMobile()"></div>
<aside id="sidebar" aria-label="Main Navigation">
  <div class="logo">
    <div class="logo-brand" onclick="toggleSidebarCollapse()" title="Toggle Sidebar">
      <div class="flame"><i class="fas fa-fire" style="color:#fff"></i></div>
      <div class="logo-text">
        <div class="logo-title">Spark</div>
        <div class="logo-subtitle">Learn & Focus</div>
      </div>
    </div>
    <button id="sidebar-collapse-btn" class="sidebar-collapse-btn" onclick="toggleSidebarCollapse()" title="Collapse sidebar (Ctrl+B)" aria-label="Collapse sidebar">
      <i class="fas fa-chevron-left" id="sidebar-collapse-icon"></i>
    </button>
  </div>
  <nav id="nav">
    <a href="#dashboard" data-view="dashboard" class="active" data-tooltip="Dashboard" title="Dashboard"><i class="fas fa-home"></i><span class="nav-text">Dashboard</span></a>
    <a href="#focus" data-view="focus" data-tooltip="Focus Lab" title="Focus Lab"><i class="fas fa-bullseye"></i><span class="nav-text">Focus Lab</span></a>
    <a href="#planner" data-view="planner" data-tooltip="Task Planner" title="Task Planner"><i class="fas fa-list-check"></i><span class="nav-text">Task Planner</span></a>
    <a href="#schedule" data-view="schedule" data-tooltip="Schedule & Timetable" title="Schedule & Timetable"><i class="fas fa-calendar-days"></i><span class="nav-text">Schedule & Timetable</span></a>
    <a href="#wellness" data-view="wellness" data-tooltip="Mind & Mood" title="Mind & Mood"><i class="fas fa-heart-pulse"></i><span class="nav-text">Mind & Mood</span></a>
    <a href="#learn" data-view="learn" data-tooltip="Learn & Play" title="Learn & Play"><i class="fas fa-gamepad"></i><span class="nav-text">Learn & Play</span></a>
    <a href="#flashcards" data-view="flashcards" data-tooltip="Flashcards" title="Flashcards"><i class="fas fa-clone"></i><span class="nav-text">Flashcards</span></a>
    <a href="#store" data-view="store" data-tooltip="Store" title="Store"><i class="fas fa-store"></i><span class="nav-text">Store</span></a>
    <a href="#resources" data-view="resources" data-tooltip="Resources" title="Resources"><i class="fas fa-book-open"></i><span class="nav-text">Resources</span></a>
    <a href="#progress" data-view="progress" data-tooltip="Progress" title="Progress"><i class="fas fa-chart-line"></i><span class="nav-text">Progress</span></a>
    <a href="#settings" data-view="settings" data-tooltip="Settings" title="Settings"><i class="fas fa-cog"></i><span class="nav-text">Settings</span></a>
  </nav>
  <div class="user-panel" id="user-panel"></div>
  <div class="sidebar-footer">
    <button id="sidebar-footer-toggle" class="sidebar-footer-toggle-btn" onclick="toggleSidebarCollapse()" title="Toggle Sidebar (Ctrl+B)">
      <i class="fas fa-angles-left" id="sidebar-footer-icon"></i>
      <span class="footer-btn-text">Collapse</span>
    </button>
  </div>
</aside>
<div id="main">
  <header id="app-topbar" class="app-topbar">
    <div class="topbar-left">
      <button id="topbar-toggle-btn" class="topbar-toggle-btn" onclick="toggleSidebarCollapse()" title="Toggle Sidebar (Ctrl+B)" aria-label="Toggle Sidebar">
        <i class="fas fa-bars"></i>
      </button>
      <div class="topbar-view-info">
        <span id="topbar-view-icon" class="topbar-view-icon"><i class="fas fa-home"></i></span>
        <span id="topbar-view-title" class="topbar-view-title">Dashboard</span>
      </div>
    </div>
    <div class="topbar-right">
      <div class="topbar-date" id="topbar-date"></div>
      <div class="topbar-streak" id="topbar-streak"></div>
      <button class="btn btn-sm btn-ghost" id="topbar-focus-quickbtn" onclick="navigate('focus')" title="Quick Focus Session" style="border:1px solid var(--border); font-size:12px; gap:6px;">
        <i class="fas fa-bullseye" style="color:var(--teal);"></i> <span>Focus</span>
      </button>
    </div>
  </header>
  <div id="view-dashboard" class="view active"></div>
  <div id="view-focus" class="view"></div>
  <div id="view-planner" class="view"></div>
  <div id="view-schedule" class="view"></div>
  <div id="view-wellness" class="view"></div>
  <div id="view-learn" class="view"></div>
  <div id="view-flashcards" class="view"></div>
  <div id="view-store" class="view"></div>
  <div id="view-resources" class="view"></div>
  <div id="view-progress" class="view"></div>
  <div id="view-settings" class="view"></div>
</div>
<div id="toast-container"></div>
<div id="modal-root"></div>

<!-- Sticky Notes Layer & Dock -->
<div id="sticky-notes-layer"></div>
<div id="sticky-dock">
  <div class="sticky-dock-menu" id="sticky-dock-menu" style="display:none;">
    <button onclick="createNewStickyNote()"><i class="fas fa-plus" style="color:var(--accent);"></i> New Sticky Note</button>
    <button onclick="scatterStickyNotes()"><i class="fas fa-arrows-spin" style="color:var(--teal);"></i> Scatter Notes</button>
    <button onclick="stackStickyNotes()"><i class="fas fa-layer-group" style="color:var(--blue);"></i> Cascade Stack</button>
    <button onclick="toggleStickyNotesVisibility()"><i class="fas fa-eye-slash" style="color:var(--text2);"></i> <span id="sticky-vis-text">Hide All</span></button>
  </div>
  <button class="sticky-main-btn" id="sticky-main-btn" onclick="toggleStickyDockMenu()" title="Sticky Notes (Click to Open Menu)">
    <i class="fas fa-sticky-note"></i>
    <span class="sticky-count-badge" id="sticky-count-badge">0</span>
  </button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script>if (!window.Tone) document.write('<script src="/node_modules/tone/build/Tone.js"><\/script>');</script>
<script src="script.js"></script>
</body>
</html>

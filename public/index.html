<div id="sticky-notes-layer"></div>
<div id="sticky-dock">
  <div class="sticky-dock-menu" id="sticky-dock-menu" style="display:none;">

    <button onclick="scatterStickyNotes()"><i class="fas fa-arrows-spin" style="color:var(--teal);"></i> <span data-i18n="sticky_scatter">Scatter Notes</span></button>
    <button onclick="stackStickyNotes()"><i class="fas fa-layer-group" style="color:var(--blue);"></i> <span data-i18n="sticky_stack">Cascade Stack</span></button>
